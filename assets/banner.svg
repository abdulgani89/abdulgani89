<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#162447"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <!-- Wave path top -->
    <clipPath id="wave-clip">
      <path d="M0,0 L1200,0 L1200,180 Q900,220 600,195 Q300,170 0,200 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e3a5a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40"  x2="1200" y2="40"/>
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="200"  y1="0" x2="200"  y2="220"/>
    <line x1="400"  y1="0" x2="400"  y2="220"/>
    <line x1="600"  y1="0" x2="600"  y2="220"/>
    <line x1="800"  y1="0" x2="800"  y2="220"/>
    <line x1="1000" y1="0" x2="1000" y2="220"/>
  </g>

  <!-- Glowing accent circles -->
  <circle cx="80"  cy="40"  r="60"  fill="#00d4ff" opacity="0.04"/>
  <circle cx="1140" cy="180" r="80" fill="#00d4ff" opacity="0.05"/>
  <circle cx="600" cy="220" r="120" fill="#162447" opacity="0.5"/>

  <!-- Accent top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Terminal bracket decoration -->
  <text x="60" y="90" font-family="monospace" font-size="52" fill="#00d4ff" opacity="0.12" font-weight="bold">{}</text>
  <text x="1090" y="180" font-family="monospace" font-size="52" fill="#00d4ff" opacity="0.10" font-weight="bold">/&gt;</text>

  <!-- Main name -->
  <text
    x="600" y="115"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="40"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="2">Muhamad Abdul Gani</text>

  <!-- Accent underline -->
  <rect x="420" y="122" width="360" height="2" rx="1" fill="url(#accent)" opacity="0.8"/>

  <!-- Subtitle -->
  <text
    x="600" y="155"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="15"
    fill="#00d4ff"
    opacity="0.9"
    letter-spacing="1">Full-Stack Web Developer  ·  AI &amp; Computer Vision Enthusiast</text>

  <!-- Bottom wave -->
  <path d="M0,210 Q300,185 600,200 Q900,215 1200,195 L1200,220 L0,220 Z" fill="#0d1117" opacity="0.6"/>
  <rect x="0" y="216" width="1200" height="4" fill="url(#accent)" opacity="0.3"/>
</svg>
