<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d18"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="vbGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="60%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </radialGradient>
    <radialGradient id="sbGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </radialGradient>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="1200" height="230" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g stroke="#182840" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="57" x2="1200" y2="57"/>
    <line x1="0" y1="115" x2="1200" y2="115"/>
    <line x1="0" y1="172" x2="1200" y2="172"/>
    <line x1="200" y1="0" x2="200" y2="230"/>
    <line x1="400" y1="0" x2="400" y2="230"/>
    <line x1="600" y1="0" x2="600" y2="230"/>
    <line x1="800" y1="0" x2="800" y2="230"/>
    <line x1="1000" y1="0" x2="1000" y2="230"/>
  </g>

  <!-- Top cyan bar (pulsing) -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyanGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Bottom bar -->
  <rect x="0" y="227" width="1200" height="3" fill="url(#cyanGrad)" opacity="0.35"/>

  <!-- ══ CIRCUIT DECORATIONS (top-left) ══ -->
  <g fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.35">
    <polyline points="5,25 28,25 28,8 60,8"/>
    <circle cx="60" cy="8" r="3" fill="#00d4ff"/>
    <polyline points="5,45 16,45 16,70 42,70"/>
    <circle cx="42" cy="70" r="3" fill="#00d4ff"/>
    <polyline points="5,85 44,85 44,100 70,100"/>
    <circle cx="70" cy="100" r="3" fill="#00d4ff"/>
    <line x1="28" y1="8" x2="28" y2="25"/>
    <line x1="16" y1="45" x2="16" y2="70"/>
    <line x1="44" y1="85" x2="44" y2="100"/>
  </g>
  <!-- Circuit decorations (top-right, mirrored) -->
  <g fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.35" transform="translate(1200,0) scale(-1,1)">
    <polyline points="5,25 28,25 28,8 60,8"/>
    <circle cx="60" cy="8" r="3" fill="#00d4ff"/>
    <polyline points="5,45 16,45 16,70 42,70"/>
    <circle cx="42" cy="70" r="3" fill="#00d4ff"/>
    <polyline points="5,85 44,85 44,100 70,100"/>
    <circle cx="70" cy="100" r="3" fill="#00d4ff"/>
  </g>

  <!-- ══ VOLLEYBALL (bouncing) ══ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="115,60; 115,148; 115,60"
      dur="1.5s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
    <circle cx="0" cy="0" r="32" fill="url(#vbGrad)" stroke="#bb5500" stroke-width="1.5"/>
    <!-- Panel seams -->
    <path d="M-32,0 Q-15,-20 0,-24 Q15,-20 32,0" fill="none" stroke="white" stroke-width="2.2" opacity="0.82"/>
    <path d="M-32,0 Q-15,20 0,24 Q15,20 32,0" fill="none" stroke="white" stroke-width="2.2" opacity="0.82"/>
    <path d="M0,-32 Q-22,-14 -27,8 Q-14,24 0,32" fill="none" stroke="white" stroke-width="1.6" opacity="0.6"/>
    <path d="M0,-32 Q22,-14 27,8 Q14,24 0,32" fill="none" stroke="white" stroke-width="1.6" opacity="0.6"/>
    <!-- Shine -->
    <ellipse cx="-9" cy="-10" rx="8" ry="5" fill="white" opacity="0.18" transform="rotate(-30 -9 -10)"/>
  </g>
  <!-- Shadow (squishes when ball is low) -->
  <ellipse cx="115" cy="192" rx="28" ry="6" fill="#000" opacity="0.0">
    <animate attributeName="opacity" values="0.0;0.18;0.0" dur="1.5s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
    <animate attributeName="rx" values="28;22;28" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <text x="115" y="207" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff9900" opacity="0.8" letter-spacing="2">VOLLEYBALL</text>

  <!-- ══ SOCCER BALL (spinning) ══ -->
  <g transform="translate(1085,110)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="32" fill="url(#sbGrad)" stroke="#888" stroke-width="1.5"/>
      <!-- Center pentagon -->
      <polygon points="0,-14 13.3,-4.3 8.2,11.3 -8.2,11.3 -13.3,-4.3" fill="#111"/>
      <!-- 5 surrounding pentagons -->
      <polygon points="0,-30 11.4,-23 8,-12 -8,-12 -11.4,-23" fill="#111" opacity="0.9"/>
      <polygon points="11.4,-23 25,-11 22,2 10,2 8,-12"      fill="#111" opacity="0.9"/>
      <polygon points="22,2 28,16 17,26 5,20 10,2"           fill="#111" opacity="0.9"/>
      <polygon points="-22,2 -28,16 -17,26 -5,20 -10,2"     fill="#111" opacity="0.9"/>
      <polygon points="-11.4,-23 -25,-11 -22,2 -10,2 -8,-12" fill="#111" opacity="0.9"/>
      <!-- Shine -->
      <ellipse cx="-9" cy="-11" rx="8" ry="5" fill="white" opacity="0.25" transform="rotate(-30 -9 -11)"/>
    </g>
  </g>
  <text x="1085" y="157" text-anchor="middle" font-family="monospace" font-size="9" fill="#bbbbbb" opacity="0.8" letter-spacing="2">SEPAKBOLA</text>

  <!-- ══ FLOATING CODE — LEFT ZONE (x: 210–420) ══ -->

  <!-- Binary col 1 -->
  <text x="225" y="0" font-family="monospace" font-size="11" fill="#00d4ff" letter-spacing="3" opacity="0">
    <tspan x="225" dy="0">1 0 1 1</tspan>
    <tspan x="225" dy="15">0 1 0 0</tspan>
    <tspan x="225" dy="15">1 1 0 1</tspan>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="3.2s" begin="0s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,220; 0,-10" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- keyword: const -->
  <text x="270" y="80" font-family="monospace" font-size="13" fill="#ff79c6" opacity="0">
    const
    <animate attributeName="opacity" values="0;0.65;0.65;0" dur="4s" begin="0.6s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,25; 0,-35" dur="4s" begin="0.6s" repeatCount="indefinite"/>
  </text>

  <!-- Binary col 2 -->
  <text x="345" y="0" font-family="monospace" font-size="11" fill="#00d4ff" letter-spacing="3" opacity="0">
    <tspan x="345" dy="0">0 0 1 1</tspan>
    <tspan x="345" dy="15">1 0 1 0</tspan>
    <tspan x="345" dy="15">0 1 1 1</tspan>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="3.6s" begin="1.4s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,220; 0,-10" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- symbol: </> -->
  <text x="300" y="150" font-family="monospace" font-size="20" fill="#50fa7b" opacity="0" font-weight="bold">
    &lt;/&gt;
    <animate attributeName="opacity" values="0;0.55;0.55;0" dur="5s" begin="0.9s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,-45" dur="5s" begin="0.9s" repeatCount="indefinite"/>
  </text>

  <!-- symbol: { } -->
  <text x="395" y="55" font-family="monospace" font-size="17" fill="#ffb86c" opacity="0" font-weight="bold">
    { }
    <animate attributeName="opacity" values="0;0.55;0.55;0" dur="4.5s" begin="2.2s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,-40" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- ══ FLOATING CODE — RIGHT ZONE (x: 780–980) ══ -->

  <!-- Binary col 3 -->
  <text x="800" y="0" font-family="monospace" font-size="11" fill="#00d4ff" letter-spacing="3" opacity="0">
    <tspan x="800" dy="0">1 0 0 1</tspan>
    <tspan x="800" dy="15">0 1 1 0</tspan>
    <tspan x="800" dy="15">1 0 1 1</tspan>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="3.4s" begin="0.7s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,220; 0,-10" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
  </text>

  <!-- keyword: def -->
  <text x="862" y="75" font-family="monospace" font-size="13" fill="#ff79c6" opacity="0">
    def
    <animate attributeName="opacity" values="0;0.65;0.65;0" dur="4s" begin="1.6s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,25; 0,-35" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- Binary col 4 -->
  <text x="930" y="0" font-family="monospace" font-size="11" fill="#00d4ff" letter-spacing="3" opacity="0">
    <tspan x="930" dy="0">0 1 0 1</tspan>
    <tspan x="930" dy="15">1 1 0 0</tspan>
    <tspan x="930" dy="15">0 0 1 0</tspan>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="3s" begin="2.3s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,220; 0,-10" dur="3s" begin="2.3s" repeatCount="indefinite"/>
  </text>

  <!-- symbol: () => -->
  <text x="782" y="155" font-family="monospace" font-size="14" fill="#50fa7b" opacity="0">
    () =&gt;
    <animate attributeName="opacity" values="0;0.55;0.55;0" dur="5s" begin="0.3s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,-45" dur="5s" begin="0.3s" repeatCount="indefinite"/>
  </text>

  <!-- symbol: [ ] -->
  <text x="945" y="52" font-family="monospace" font-size="17" fill="#ffb86c" opacity="0" font-weight="bold">
    [ ]
    <animate attributeName="opacity" values="0;0.55;0.55;0" dur="4.2s" begin="2.9s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,-40" dur="4.2s" begin="2.9s" repeatCount="indefinite"/>
  </text>

  <!-- ══ IT SPINNER (center top) ══ -->
  <g transform="translate(600,22)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.4"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#00d4ff" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══ NAME (center) ══ -->

  <!-- Glow halo layer -->
  <text x="600" y="113"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="41" font-weight="800"
    fill="#00d4ff" opacity="0">
    Muhamad Abdul Gani
    <animate attributeName="opacity" values="0;0.12;0" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Main name -->
  <text x="600" y="113"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="41" font-weight="800"
    fill="#ffffff" letter-spacing="2">
    Muhamad Abdul Gani
    <animate attributeName="fill" values="#ffffff;#d8f4ff;#ffffff" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Animated underline -->
  <rect x="415" y="121" width="370" height="2.5" rx="1.25" fill="url(#cyanGrad)">
    <animate attributeName="width" values="370;415;370" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="415;392;415" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="600" y="150"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="14" fill="#00d4ff"
    letter-spacing="1.5" opacity="0.85">
    Full-Stack Web Developer  ·  AI &amp; Computer Vision Enthusiast
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Terminal line -->
  <text x="600" y="175"
    text-anchor="middle"
    font-family="monospace"
    font-size="11.5" fill="#8be9fd" opacity="0">
    &gt;_ PTIK — UNNES  |  Semarang, Indonesia
    <animate attributeName="opacity" values="0;0.65;0.65;0" dur="4.5s" begin="0.5s" repeatCount="indefinite" keyTimes="0;0.2;0.75;1"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="748" y="163" width="8" height="14" rx="1" fill="#00d4ff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0;0.8;0" dur="1s" begin="0.8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
  </rect>

  <!-- Bottom subtle wave -->
  <path d="M0,220 Q300,210 600,218 Q900,226 1200,215 L1200,230 L0,230 Z" fill="#00d4ff" opacity="0.07"/>

</svg>
