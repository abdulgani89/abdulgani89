<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="45" viewBox="0 0 1200 45">
  <defs>
    <linearGradient id="dLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="80%"  stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="45" fill="#040d18"/>

  <!-- Pulsing center line -->
  <line x1="0" y1="22" x2="1200" y2="22" stroke="url(#dLine)" stroke-width="1">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Floating code symbols (top) -->
  <text x="110" y="16" font-family="monospace" font-size="10" fill="#00d4ff" opacity="0">{ }
    <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="310" y="36" font-family="monospace" font-size="10" fill="#50fa7b" opacity="0">&lt;/&gt;
    <animate attributeName="opacity" values="0;0.55;0" dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
  </text>
  <text x="490" y="14" font-family="monospace" font-size="9" fill="#ff79c6" opacity="0">class
    <animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="0.4s" repeatCount="indefinite"/>
  </text>
  <text x="700" y="36" font-family="monospace" font-size="9" fill="#ffb86c" opacity="0">import
    <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
  </text>
  <text x="880" y="15" font-family="monospace" font-size="10" fill="#00d4ff" opacity="0">{ }
    <animate attributeName="opacity" values="0;0.55;0" dur="3.8s" begin="0.7s" repeatCount="indefinite"/>
  </text>
  <text x="1050" y="36" font-family="monospace" font-size="10" fill="#50fa7b" opacity="0">[ ]
    <animate attributeName="opacity" values="0;0.55;0" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
  </text>

  <!-- ⚽ SOCCER BALL rolling left → center -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="15,22; 591,22; 15,22"
      dur="6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="1080 0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="13" fill="#eeeeee" stroke="#888" stroke-width="1.2"/>
      <polygon points="0,-7 6.6,-2.2 4.1,5.7 -4.1,5.7 -6.6,-2.2" fill="#1a1a1a"/>
      <polygon points="0,-14 5.7,-11 4,-6 -4,-6 -5.7,-11" fill="#1a1a1a" opacity="0.7"/>
      <polygon points="11,-9 14,0 10,8 11,-9" fill="#1a1a1a" opacity="0.5"/>
      <polygon points="-11,-9 -14,0 -10,8 -11,-9" fill="#1a1a1a" opacity="0.5"/>
    </g>
  </g>

  <!-- 🏐 VOLLEYBALL rolling right → center -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="1185,22; 609,22; 1185,22"
      dur="6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="-1080 0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="13" fill="#ff9900" stroke="#cc5500" stroke-width="1.2"/>
      <path d="M-13,0 Q-6,-9 0,-11 Q6,-9 13,0" fill="none" stroke="white" stroke-width="1.5" opacity="0.85"/>
      <path d="M-13,0 Q-6,9 0,11 Q6,9 13,0" fill="none" stroke="white" stroke-width="1.5" opacity="0.85"/>
      <path d="M0,-13 Q-9,-5 -11,4 Q-5,10 0,13" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
      <path d="M0,-13 Q9,-5 11,4 Q5,10 0,13" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
    </g>
  </g>

  <!-- Collision flash at center (t=3s = 50% of 6s cycle) -->
  <circle cx="600" cy="22" r="30" fill="url(#flash)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.47;0.5;0.53;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0;0;30;0;0" keyTimes="0;0.47;0.5;0.53;1" dur="6s" repeatCount="indefinite"/>
  </circle>

</svg>
