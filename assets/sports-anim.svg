<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d18"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="cyn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <radialGradient id="vb" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="60%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </radialGradient>
    <radialGradient id="sb" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </radialGradient>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="900" height="210" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#182840" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="52" x2="900" y2="52"/>
    <line x1="0" y1="105" x2="900" y2="105"/>
    <line x1="0" y1="158" x2="900" y2="158"/>
    <line x1="180" y1="0" x2="180" y2="210"/>
    <line x1="360" y1="0" x2="360" y2="210"/>
    <line x1="540" y1="0" x2="540" y2="210"/>
    <line x1="720" y1="0" x2="720" y2="210"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="900" height="3" fill="url(#cyn)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ BACKGROUND TINT: Soccer phase (green) ══ -->
  <rect width="900" height="210" fill="#003a00" opacity="0">
    <animate attributeName="opacity"
      values="0.07;0.07;0.07;0;0;0;0.07;0.07;0.07"
      keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1"
      dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ BACKGROUND TINT: Volleyball phase (orange) ══ -->
  <rect width="900" height="210" fill="#3a1500" opacity="0">
    <animate attributeName="opacity"
      values="0;0;0;0.06;0.06;0.06;0;0;0"
      keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1"
      dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ IT CODE PARTICLES (left) ══ -->
  <text x="30" y="0" font-family="monospace" font-size="10" fill="#00d4ff" letter-spacing="2" opacity="0">
    <tspan x="30" dy="0">1 0 1</tspan><tspan x="30" dy="13">0 1 1</tspan><tspan x="30" dy="13">1 0 0</tspan>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="3s" begin="0s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,200; 0,-10" dur="3s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="68" y="80" font-family="monospace" font-size="12" fill="#ff79c6" opacity="0">const
    <animate attributeName="opacity" values="0;0.6;0;0.6;0" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,-30" dur="5s" begin="0.5s" repeatCount="indefinite"/>
  </text>
  <text x="20" y="145" font-family="monospace" font-size="14" fill="#50fa7b" opacity="0" font-weight="bold">&lt;/&gt;
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,15; 0,-35" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- ══ IT CODE PARTICLES (right) ══ -->
  <text x="820" y="0" font-family="monospace" font-size="10" fill="#00d4ff" letter-spacing="2" opacity="0">
    <tspan x="820" dy="0">0 1 0</tspan><tspan x="820" dy="13">1 1 0</tspan><tspan x="820" dy="13">0 0 1</tspan>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="3.3s" begin="0.6s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,200; 0,-10" dur="3.3s" begin="0.6s" repeatCount="indefinite"/>
  </text>
  <text x="800" y="78" font-family="monospace" font-size="12" fill="#ff79c6" opacity="0">def
    <animate attributeName="opacity" values="0;0.6;0;0.6;0" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,-30" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
  </text>
  <text x="828" y="150" font-family="monospace" font-size="14" fill="#ffb86c" opacity="0" font-weight="bold">[ ]
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4s" begin="2.2s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    <animateTransform attributeName="transform" type="translate" values="0,15; 0,-35" dur="4s" begin="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- ══ GROUND LINE ══ -->
  <line x1="100" y1="168" x2="800" y2="168" stroke="#1a3050" stroke-width="1" opacity="0.6"/>

  <!-- Soccer field line (appears during soccer phase) -->
  <line x1="100" y1="168" x2="800" y2="168" stroke="#aaffaa" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0.35;0.35;0.35;0;0;0;0.35;0.35;0.35" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>
  <!-- Court line (appears during volleyball phase) -->
  <line x1="100" y1="168" x2="800" y2="168" stroke="#ffe4aa" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.3;0.3;0.3;0;0;0" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- ══ VOLLEYBALL NET (volleyball phase only) ══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.75;0.75;0.75;0;0;0" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <!-- Poles -->
    <line x1="590" y1="128" x2="590" y2="168" stroke="#aaaaaa" stroke-width="2.5"/>
    <line x1="640" y1="128" x2="640" y2="168" stroke="#aaaaaa" stroke-width="2.5"/>
    <!-- Net top bar -->
    <line x1="580" y1="128" x2="650" y2="128" stroke="#888888" stroke-width="2"/>
    <!-- Net mesh -->
    <line x1="580" y1="132" x2="650" y2="132" stroke="#777" stroke-width="0.8" opacity="0.7"/>
    <line x1="580" y1="137" x2="650" y2="137" stroke="#777" stroke-width="0.8" opacity="0.7"/>
    <line x1="580" y1="142" x2="650" y2="142" stroke="#777" stroke-width="0.8" opacity="0.7"/>
    <line x1="600" y1="128" x2="600" y2="142" stroke="#777" stroke-width="0.6" opacity="0.5"/>
    <line x1="610" y1="128" x2="610" y2="142" stroke="#777" stroke-width="0.6" opacity="0.5"/>
    <line x1="620" y1="128" x2="620" y2="142" stroke="#777" stroke-width="0.6" opacity="0.5"/>
    <line x1="630" y1="128" x2="630" y2="142" stroke="#777" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!--  STICK FIGURE — transitions between   -->
  <!--  Soccer kick ↔ Volleyball spike       -->
  <!-- Poses: S=Soccer K=Kick VL=VballLand VJ=VballJump -->
  <!-- keyTimes: 0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1 -->
  <!--           S  K    S    VL   VJ   VL   S    K    S  -->
  <!-- ══════════════════════════════════════ -->

  <!-- HEAD -->
  <circle r="17" stroke-width="2">
    <animate attributeName="cx" values="450;450;450;450;450;450;450;450;450" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="72;70;72;57;45;57;72;70;72" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#a8d8ff;#a8d8ff;#a8d8ff;#ff9900;#ff9900;#ff9900;#a8d8ff;#a8d8ff;#a8d8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#6ab8ff;#6ab8ff;#6ab8ff;#cc6600;#cc6600;#cc6600;#6ab8ff;#6ab8ff;#6ab8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- Face eyes (dots) -->
  <circle cx="444" cy="70" r="2" fill="#040d18" opacity="0.4"/>
  <circle cx="456" cy="70" r="2" fill="#040d18" opacity="0.4"/>

  <!-- BODY -->
  <line x1="450" stroke-width="3.5" stroke-linecap="round">
    <animate attributeName="y1" values="89;87;89;74;62;74;89;87;89" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="450;450;450;450;450;450;450;450;450" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="122;120;122;108;96;108;122;120;122" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#a8d8ff;#a8d8ff;#a8d8ff;#ff9900;#ff9900;#ff9900;#a8d8ff;#a8d8ff;#a8d8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- LEFT ARM -->
  <line x1="450" stroke-width="3" stroke-linecap="round">
    <animate attributeName="y1" values="103;101;103;89;77;89;103;101;103" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="414;412;414;414;414;414;414;412;414" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="119;117;119;65;53;65;119;117;119" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#a8d8ff;#a8d8ff;#a8d8ff;#ff9900;#ff9900;#ff9900;#a8d8ff;#a8d8ff;#a8d8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- RIGHT ARM -->
  <line x1="450" stroke-width="3" stroke-linecap="round">
    <animate attributeName="y1" values="103;101;103;89;77;89;103;101;103" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="486;488;486;490;490;490;486;488;486" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="92;88;92;57;45;57;92;88;92" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#a8d8ff;#a8d8ff;#a8d8ff;#ff9900;#ff9900;#ff9900;#a8d8ff;#a8d8ff;#a8d8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- LEFT LEG -->
  <line x1="450" stroke-width="3.5" stroke-linecap="round">
    <animate attributeName="y1" values="122;120;122;108;96;108;122;120;122" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="430;428;430;430;430;430;430;428;430" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="162;162;162;148;136;148;162;162;162" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#a8d8ff;#a8d8ff;#a8d8ff;#ff9900;#ff9900;#ff9900;#a8d8ff;#a8d8ff;#a8d8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- RIGHT LEG (kick ↔ bent) -->
  <line x1="450" stroke-width="3.5" stroke-linecap="round">
    <animate attributeName="y1" values="122;120;122;108;96;108;122;120;122" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="472;500;472;472;472;472;472;500;472" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="162;106;162;145;133;145;162;106;162" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#a8d8ff;#a8d8ff;#a8d8ff;#ff9900;#ff9900;#ff9900;#a8d8ff;#a8d8ff;#a8d8ff" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- ══ SOCCER BALL (at kicking foot, disappears on volleyball phase) ══ -->
  <!-- Outer translate group -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="510,113; 515,101; 510,113; 510,113; 510,113; 510,113; 510,113; 515,101; 510,113"
      keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <!-- Inner rotate group -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;1;0;0;0;1;1;1" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="720 0 0" dur="10s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="17" fill="url(#sb)" stroke="#888" stroke-width="1.5"/>
      <polygon points="0,-9 8.5,-2.8 5.3,7.3 -5.3,7.3 -8.5,-2.8" fill="#111"/>
      <polygon points="0,-17 7,-14 5,-7 -5,-7 -7,-14" fill="#111" opacity="0.8"/>
      <polygon points="7,-14 15,-7 14,2 7,2 5,-7" fill="#111" opacity="0.8"/>
      <polygon points="-7,-14 -15,-7 -14,2 -7,2 -5,-7" fill="#111" opacity="0.8"/>
      <ellipse cx="-5" cy="-7" rx="5" ry="3" fill="white" opacity="0.2" transform="rotate(-30 -5 -7)"/>
    </g>
  </g>

  <!-- ══ VOLLEYBALL (above raised right hand, appears on volleyball phase) ══ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="492,42; 492,42; 492,42; 496,48; 496,32; 496,48; 492,42; 492,42; 492,42"
      keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="0;0;0;1;1;1;0;0;0" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="3s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="17" fill="url(#vb)" stroke="#cc5500" stroke-width="1.5"/>
      <path d="M-17,0 Q-8,-12 0,-14 Q8,-12 17,0" fill="none" stroke="white" stroke-width="2" opacity="0.85"/>
      <path d="M-17,0 Q-8,12 0,14 Q8,12 17,0" fill="none" stroke="white" stroke-width="2" opacity="0.85"/>
      <path d="M0,-17 Q-13,-8 -15,5 Q-8,14 0,17" fill="none" stroke="white" stroke-width="1.5" opacity="0.65"/>
      <path d="M0,-17 Q13,-8 15,5 Q8,14 0,17" fill="none" stroke="white" stroke-width="1.5" opacity="0.65"/>
      <ellipse cx="-5" cy="-7" rx="5" ry="3" fill="white" opacity="0.25" transform="rotate(-30 -5 -7)"/>
    </g>
  </g>

  <!-- ══ MODE LABELS ══ -->
  <!-- Soccer mode label -->
  <text x="450" y="192" text-anchor="middle" font-family="monospace" font-size="12" fill="#a8d8ff" letter-spacing="2" opacity="0">
    &gt; soccer.kick()
    <animate attributeName="opacity" values="0.9;0.9;0.9;0;0;0;0.9;0.9;0.9" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <!-- Volleyball mode label -->
  <text x="450" y="192" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff9900" letter-spacing="2" opacity="0">
    &gt; volleyball.spike()
    <animate attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0;0;0" keyTimes="0;0.15;0.30;0.40;0.55;0.70;0.80;0.90;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- ══ TRANSITION FLASH ══ -->
  <rect width="900" height="210" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.06;0;0;0;0;0;0;0;0;0.06;0;0" keyTimes="0;0.28;0.30;0.33;0.36;0.40;0.68;0.70;0.73;0.76;0.80;0.88;0.90;0.93;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- IT SPINNER (top center) -->
  <g transform="translate(450,15)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#00d4ff" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="207" width="900" height="3" fill="url(#cyn)" opacity="0.3"/>
</svg>
